aid: dida
name: Dida
description: >-
  DidaTravel (道旅科技, Shenzhen Dida Travel Technology Co., Ltd.) is a
  technology-driven global travel distribution company. It operates an open
  platform that connects travel buyers and suppliers, providing flexible
  connectivity solutions across hotels, flights, airport transfers, and
  attraction tickets. Headquartered in Shenzhen, China, DidaTravel serves online
  travel agencies, tour operators, and other travel businesses worldwide with
  aggregated hotel content, dynamic rates, and booking delivered through its B2B
  distribution technology. The company positions itself as a global technology
  leader in travel product connectivity and is backed by investors including IDG
  Capital.
